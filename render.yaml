services:
  - type: web
    name: crud-flask-reserva-temporal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: reserva_boletos
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
